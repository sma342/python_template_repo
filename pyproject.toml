[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pylint.FORMAT]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "C0114", # Missing module docstring (wyłączone, żeby pylint nie truł d*py o brak docstringów na górze każdego pliku)
    "C0115", # Missing class docstring
    "C0116", # Missing function docstring
]

[tool.pylint.MASTER]
ignore-paths = ["tests/.*"] # Opcjonalnie: ignorowanie dokładnego lintowania folderu z testami